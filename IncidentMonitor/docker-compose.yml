services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incident_monitor
      POSTGRES_USER: im_user
      POSTGRES_PASSWORD: im_pass
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U im_user -d incident_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: im_user
      RABBITMQ_DEFAULT_PASS: im_pass
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      ConnectionStrings__Postgres: >
        Host=postgres;Database=incident_monitor;Username=im_user;Password=im_pass
      ConnectionStrings__Redis: redis:6379
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: im_user
      RabbitMQ__Pass: im_pass
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"
    depends_on:
      postgres:  { condition: service_healthy }
      redis:     { condition: service_healthy }
      rabbitmq:  { condition: service_healthy }

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      ConnectionStrings__Postgres: >
        Host=postgres;Database=incident_monitor;Username=im_user;Password=im_pass
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: im_user
      RabbitMQ__Pass: im_pass
    depends_on:
      postgres:  { condition: service_healthy }
      rabbitmq:  { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pg_data: